services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: desafio_aceito
      POSTGRES_USER: desafio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - desafio_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U desafio -d desafio_aceito"]
      interval: 5s
      retries: 10
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: postgresql://desafio:${POSTGRES_PASSWORD}@database:5432/desafio_aceito
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      database:
        condition: service_healthy
volumes:
  desafio_db:
